<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume — Jeffrey Resto</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="site-header">
  <h1 class="brand">
    <a href="/">
      <span class="logo-badge">JR</span>
      <span class="logo-text">Jeffrey&nbsp;Resto</span>
    </a>
  </h1>

  <nav class="site-nav">
    <a href="/">Home</a>
    <a href="/projects/">Projects</a>
    <a href="/resume/">Resume</a>
    <a href="/credentials/">Credentials</a>
    <a href="mailto:restojeffrey@gmail.com">Contact</a>
  </nav>
  <button class="nav-toggle" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
    ☰
  </button>
  
  <!-- Mobile dropdown menu -->
  <nav id="mobile-menu" class="mobile-menu" hidden>
    <a href="/">Home</a>
    <a href="/projects/">Projects</a>
    <a href="/resume/">Resume</a>
    <a href="/credentials/">Credentials</a>
    <a href="mailto:restojeffrey@gmail.com">Contact</a>
  </nav>

</header>


<main>
  <h2>Resume</h2>

  <!-- Full-page image -->
  <div class="resume-viewer">
    <img src="/assets/img/resume/Resume.png" alt="Jeffrey Resto Resume">
  </div>
  <p class="resume-updated">Last updated: <span id="resume-date"></span></p>


  <p class="resume-actions">
    <a href="/resume/Jeffrey_Resto_Resume.pdf" download>Download PDF</a>
  </p>
</main>

<footer>
  <small>© <span id="y"></span> Jeffrey Resto</small>
</footer>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
<script>
  // Auto-fill today's date in "Month Year" format
  const date = new Date();
  const options = { year: 'numeric', month: 'long' };
  document.getElementById('resume-date').textContent = date.toLocaleDateString('en-US', options);
</script>
<script>
  (function () {
    const footer = document.querySelector('footer');
    if (!footer) return;

    // If user prefers reduced motion, show immediately
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { footer.classList.add('is-visible'); return; }

    // Reveal when the footer enters the viewport
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          footer.classList.add('is-visible');
          io.unobserve(footer);
        }
      });
    }, { threshold: 0.1 });

    io.observe(footer);

    // Fallback: show after 2s in case IO is unsupported
    setTimeout(() => footer.classList.add('is-visible'), 2000);
  })();
</script>
</body>
</html>
