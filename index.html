<script>
  (function () {
    const footer = document.querySelector('footer');
    if (!footer) return;

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { footer.classList.add('is-visible'); return; }

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          footer.classList.add('is-visible');
          io.unobserve(footer);
        }
      });
    }, { threshold: 0.1 });

    io.observe(footer);
    setTimeout(() => footer.classList.add('is-visible'), 2000);
  })();
</script>

<!-- Fade carousel logic -->
<script>
(function(){
  const root = document.querySelector('.carousel');
  if (!root) return;

  const viewport = root.querySelector('.carousel__viewport');
  const slides = Array.from(root.querySelectorAll('.carousel__slide'));
  const prevBtn = root.querySelector('.carousel__btn--prev');
  const nextBtn = root.querySelector('.carousel__btn--next');
  const dotsWrap = root.querySelector('.carousel__dots');

  let index = 0;
  let autoTimer = null;
  const intervalMs = 7000; // slower pace

  // Build dots
  dotsWrap.innerHTML = '';
  slides.forEach((_, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-label', `Go to slide ${i+1}`);
    b.addEventListener('click', () => goTo(i, true));
    dotsWrap.appendChild(b);
  });

  function update() {
    slides.forEach((el, i) => {
      el.classList.toggle('is-active', i === index);
      el.setAttribute('aria-hidden', i === index ? 'false' : 'true');
    });
    dotsWrap.querySelectorAll('button').forEach((b, i) => {
      b.setAttribute('aria-selected', i === index ? 'true' : 'false');
    });
  }

  function goTo(i, user=false) {
    index = (i + slides.length) % slides.length;
    update();
    if (user) restartAuto();
  }

  function next(){ goTo(index + 1); }
  function prev(){ goTo(index - 1); }

  // Buttons
  nextBtn && nextBtn.addEventListener('click', next);
  prevBtn && prevBtn.addEventListener('click', prev);

  // Keyboard
  root.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft')  prev();
  });
  root.tabIndex = 0;

  // Autoplay (pause on hover / off-screen / hidden tab)
  function startAuto(){
    stopAuto();
    autoTimer = setInterval(next, intervalMs);
  }
  function stopAuto(){
    if (autoTimer) clearInterval(autoTimer);
    autoTimer = null;
  }
  function restartAuto(){ stopAuto(); startAuto(); }

  root.addEventListener('mouseenter', stopAuto);
  root.addEventListener('mouseleave', startAuto);

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => e.isIntersecting ? startAuto() : stopAuto());
  }, { threshold: 0.2 });
  io.observe(root);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopAuto(); else startAuto();
  });

  // Touch swipe
  let startX = 0, dx = 0, swiping = false;
  viewport.addEventListener('touchstart', (e) => {
    swiping = true;
    startX = e.touches[0].clientX; dx = 0;
    stopAuto();
  }, { passive: true });
  viewport.addEventListener('touchmove', (e) => {
    if (!swiping) return;
    dx = e.touches[0].clientX - startX;
  }, { passive: true });
  viewport.addEventListener('touchend', () => {
    if (!swiping) return;
    if (Math.abs(dx) > 40) (dx < 0 ? next() : prev());
    swiping = false; dx = 0; startAuto();
  });

  // Init
  slides.forEach(s => s.classList.remove('is-active'));
  goTo(0);
})();
</script>

<script>
  // Flip on card click (but let the button links work normally)
  document.querySelectorAll('.lab-card').forEach(card => {
    card.addEventListener('click', (e) => {
      const anchor = e.target && e.target.closest ? e.target.closest('a') : null;
      if (anchor) return; // don't flip when clicking the View Details button
      card.classList.toggle('is-flipped');
    });
  });

  // Unflip all cards when the carousel changes slides
  (function(){
    const root = document.querySelector('.carousel');
    if (!root) return;

    const slides = Array.from(root.querySelectorAll('.carousel__slide'));
    const dotsWrap = root.querySelector('.carousel__dots');
    const prevBtn  = root.querySelector('.carousel__btn--prev');
    const nextBtn  = root.querySelector('.carousel__btn--next');

    function unflipAll() {
      slides.forEach(slide => {
        const card = slide.querySelector('.lab-card');
        if (card) card.classList.remove('is-flipped');
      });
    }

    // Unflip before manual nav
    nextBtn && nextBtn.addEventListener('click', unflipAll, { capture: true });
    prevBtn && prevBtn.addEventListener('click', unflipAll, { capture: true });
    dotsWrap && dotsWrap.addEventListener('click', unflipAll, { capture: true });

    // Unflip on auto-advance: observe aria-selected change on dots
    if (dotsWrap) {
      const mo = new MutationObserver(unflipAll);
      mo.observe(dotsWrap, { subtree: true, attributes: true, attributeFilter: ['aria-selected'] });
    }
  })();
</script>
